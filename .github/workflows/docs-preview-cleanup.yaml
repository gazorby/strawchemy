name: 🧹 Remove documentation preview

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete preview deployments
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete Cloudflare Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/strawchemy/deployments"
          cf() { curl --silent --show-error --fail-with-body -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }

          # Collect every id before deleting, so deletions do not shift the pages being read.
          ids=()
          page=1
          while :; do
            response=$(cf "${endpoint}?env=preview&page=${page}")
            mapfile -t -O "${#ids[@]}" ids < <(jq -r --arg branch "$PREVIEW_BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' <<< "$response")
            total_pages=$(jq -r '.result_info.total_pages // 1' <<< "$response")
            (( page >= total_pages )) && break
            page=$((page + 1))
          done

          echo "Found ${#ids[@]} deployment(s) for ${PREVIEW_BRANCH}"
          for id in "${ids[@]}"; do
            cf -X DELETE "${endpoint}/${id}?force=true" > /dev/null
            echo "Deleted ${id}"
          done

      - name: Update the preview comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: docs-preview
          only_update: true
          message: |
            📚 Documentation preview removed.
