name: 📚 Preview documentation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tools/docs_reference.py'
      - 'README.md'
      - '.github/workflows/docs-preview.yaml'

# Shared with docs-preview-cleanup.yaml. Previews queue instead of cancelling, so a late preview cannot cancel
# a running cleanup.
concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    name: Build and preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Build documentation
        run: mise run docs:build

      - name: Check the pull request is still open
        id: pr
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: echo "state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        id: deploy
        if: steps.pr.outputs.state == 'OPEN'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=strawchemy --branch=pr-${{ github.event.number }}

      - name: Comment the preview URL
        if: steps.pr.outputs.state == 'OPEN'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: docs-preview
          message: |
            📚 Documentation preview: https://pr-${{ github.event.number }}.strawchemy.pages.dev

            Built from ${{ github.event.pull_request.head.sha }}.
